app:
  name: tuoguan-system
  env: local

http:
  addr: ":8080"
  read_header_timeout: 5s
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 10s
  max_header_bytes: 1048576
  max_body_bytes: 8388608
  trusted_proxies: []
  cors:
    allowed_origins:
      - "http://localhost:3000"
      - "http://localhost:5173"
    allowed_methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed_headers:
      - Authorization
      - Content-Type
      - X-Request-ID
      - X-Parent-OpenID
      - X-Parent-ID
      - X-Teacher-User-ID
      - traceparent
      - tracestate
    allow_credentials: false

auth:
  secret: "tuoguan-system-local-auth-secret-change-me-2026"
  access_ttl: 2h
  refresh_ttl: 720h
  # 仅本地初始化使用；生产环境必须关闭，并通过受控流程创建管理员。
  bootstrap_admin_enabled: true
  bootstrap_admin_username: "admin"
  bootstrap_admin_password: "123456"
  # 仅本地/测试初始化平台拥有者账号；生产必须关闭并改用受控 provisioning。
  bootstrap_platform_admin_enabled: true
  bootstrap_platform_admin_username: "platform"
  bootstrap_platform_admin_password: "123456"

wechat:
  enabled: false
  app_id: ""
  app_secret: ""
  endpoint: "https://api.weixin.qq.com/sns/jscode2session"
  timeout: 5s
  subscribe_template_id: ""
  subscribe_page: "pages/parent/index"
  # 正式环境按微信公众平台模板 ID 填写；留空的类型不会发送微信订阅消息。
  subscribe_templates:
    pickup: ""
    meal: ""
    homework: ""
    leave: ""
    summary: ""
  # 业务字段名映射到微信模板的 keyword 字段 ID；未配置时使用 thing1/thing2/time3。
  subscribe_template_fields:
    pickup: { title: thing1, content: thing2, time: time3 }
    meal: { title: thing1, content: thing2, time: time3 }
    homework: { title: thing1, content: thing2, time: time3 }
    leave: { title: thing1, content: thing2, time: time3 }
    summary: { title: thing1, content: thing2, time: time3 }

sms:
  # 本地开发默认不调用短信平台，接口会返回随机 debug_code 供开发测试。
  enabled: false
  provider: local # local or tencent
  secret_id: ""
  secret_key: ""
  sdk_app_id: ""
  sign_name: ""
  template_id: ""
  region: ap-guangzhou
  endpoint: "https://sms.tencentcloudapi.com/"
  timeout: 5s
  # 留空时复用 auth.secret；生产环境建议单独设置。
  code_secret: ""
  code_length: 6
  code_ttl: 5m
  resend_interval: 60s
  max_verify_attempts: 5

storage:
  provider: local
  upload_dir: "data/uploads"
  # 留空时复用 auth.secret；生产环境建议单独设置随机高强度密钥。
  url_signing_secret: ""
  # provider=s3 时填写；正式环境必须使用私有桶和 HTTPS。
  endpoint: ""
  bucket: ""
  region: "us-east-1"
  access_key: ""
  secret_key: ""
  path_style: true
  signed_url_ttl: 15m
  max_file_bytes: 5242880
  retention_days: 90

database:
  enabled: true
  driver: mysql
  dsn: "tuoguan_system:tuoguan_system_pass@tcp(127.0.0.1:3306)/tuoguan_system"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 30m
  conn_max_idle_time: 5m
  ping_timeout: 3s

redis:
  enabled: true
  addr: "127.0.0.1:6379"
  username: ""
  password: ""
  db: 0
  dial_timeout: 3s
  read_timeout: 2s
  write_timeout: 2s
  ping_timeout: 2s
  pool_size: 10
  min_idle_conns: 2
  key_prefix: "tuoguan-system:local"

worker:
  enabled: false
  concurrency: 10
  shutdown_timeout: 10s
  notification_poll_interval: 2s
  notification_lease: 30s
  notification_max_attempts: 3
  # worker 启用时会按此间隔补齐当天的周期排班任务；仅生成待确认草稿，不会绕过老师确认直接通知家长。
  schedule_generation_interval: 5m
  queues:
    default: 1

observability:
  metrics:
    enabled: true
    path: /metrics
    namespace: tuoguan_system
  tracing:
    enabled: false
    exporter: stdout # stdout or otlp
    endpoint: localhost:4317
    insecure: true
    sample_ratio: 1.0

log:
  level: info
