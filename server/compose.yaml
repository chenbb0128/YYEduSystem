services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: tuoguan_system
      MYSQL_USER: tuoguan_system
      MYSQL_PASSWORD: tuoguan_system_pass
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -utuoguan_system -ptuoguan_system_pass --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data

  migrate:
    build:
      context: .
      dockerfile: deployments/Dockerfile
      args:
        TARGET: migrate
    command: ["-command", "up"]
    environment:
      TUOGUAN_SYSTEM_APP_ENV: local
      TUOGUAN_SYSTEM_DATABASE_ENABLED: "true"
      TUOGUAN_SYSTEM_DATABASE_DSN: tuoguan_system:tuoguan_system_pass@tcp(mysql:3306)/tuoguan_system
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: deployments/Dockerfile
      args:
        TARGET: api
    environment:
      TZ: Asia/Shanghai
      TUOGUAN_SYSTEM_APP_ENV: local
      TUOGUAN_SYSTEM_HTTP_ADDR: :8080
      TUOGUAN_SYSTEM_DATABASE_ENABLED: "true"
      TUOGUAN_SYSTEM_DATABASE_DSN: tuoguan_system:tuoguan_system_pass@tcp(mysql:3306)/tuoguan_system
      TUOGUAN_SYSTEM_REDIS_ENABLED: "true"
      TUOGUAN_SYSTEM_REDIS_ADDR: redis:6379
      TUOGUAN_SYSTEM_REDIS_KEY_PREFIX: tuoguan-system:compose
      TUOGUAN_SYSTEM_OBSERVABILITY_METRICS_ENABLED: "true"
      TUOGUAN_SYSTEM_OBSERVABILITY_METRICS_PATH: /metrics
      TUOGUAN_SYSTEM_OBSERVABILITY_METRICS_NAMESPACE: tuoguan_system
      TUOGUAN_SYSTEM_OBSERVABILITY_TRACING_ENABLED: "false"
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: deployments/Dockerfile
      args:
        TARGET: worker
    environment:
      TZ: Asia/Shanghai
      TUOGUAN_SYSTEM_APP_ENV: local
      TUOGUAN_SYSTEM_DATABASE_ENABLED: "true"
      TUOGUAN_SYSTEM_DATABASE_DSN: tuoguan_system:tuoguan_system_pass@tcp(mysql:3306)/tuoguan_system
      TUOGUAN_SYSTEM_REDIS_ENABLED: "true"
      TUOGUAN_SYSTEM_REDIS_ADDR: redis:6379
      TUOGUAN_SYSTEM_REDIS_KEY_PREFIX: tuoguan-system:compose
      TUOGUAN_SYSTEM_WORKER_ENABLED: "true"
      TUOGUAN_SYSTEM_WORKER_CONCURRENCY: "10"
      TUOGUAN_SYSTEM_OBSERVABILITY_TRACING_ENABLED: "false"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  mysql_data:
  redis_data:
  uploads_data:
