components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-hmac-token

  parameters:
    RequestIDHeader:
      name: X-Request-ID
      in: header
      required: false
      description: 客户端可传入请求 ID；缺失或格式不合法时服务端会生成新的 ID。
      schema:
        type: string
        minLength: 8
        maxLength: 128
      example: req-123.test

    PickupOperationID:
      name: id
      in: path
      required: true
      description: 接送任务 ID。
      schema: { type: integer, format: int64, minimum: 1 }

    ParentOpenIDHeader:
      name: X-Parent-OpenID
      in: header
      required: false
      deprecated: true
      description: 已废弃，仅为旧版开发客户端保留；请使用 bearerAuth。
      schema:
        type: string
        minLength: 1
        maxLength: 128

  headers:
    RequestID:
      description: 当前请求 ID。
      schema:
        type: string
      example: req-123.test

  responses:
    BadRequest:
      description: 请求不合法
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 10001
            message: 请求不合法
    Unauthorized:
      description: 未登录或登录状态已失效
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 20001
            message: 认证失败
    Forbidden:
      description: 已登录但没有当前操作权限
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 20003
            message: 没有操作权限
    NotFound:
      description: 资源不存在
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 10005
            message: 资源不存在
    MethodNotAllowed:
      description: 请求方法不允许
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 10006
            message: 请求方法不允许
    InternalError:
      description: 内部服务器错误
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 50000
            message: 内部服务器错误
    ValidationError:
      description: 请求参数校验失败
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    AuthTokenResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              required: [accessToken, refreshToken, expiresIn, principal, role]
              properties:
                accessToken: { type: string }
                refreshToken: { type: string }
                expiresIn: { type: integer, format: int64 }
                principal: { type: string, enum: [user, parent] }
                role: { type: string }
              additionalProperties: false

    PhoneCodeResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              required: [phone, masked_phone, expires_in, retry_after]
              properties:
                phone: { type: string }
                masked_phone: { type: string }
                expires_in: { type: integer, minimum: 1 }
                retry_after: { type: integer, minimum: 1 }
                debug_code: { type: string, description: 仅本地开发环境返回 }
              additionalProperties: false

    PhoneLoginResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              required: [phone, masked_phone, roles]
              properties:
                phone: { type: string }
                masked_phone: { type: string }
                roles:
                  type: array
                  items:
                    type: object
                    required: [key, principal, role, label, available]
                    properties:
                      key: { type: string, enum: [parent, staff] }
                      principal: { type: string, enum: [parent, user] }
                      role: { type: string }
                      label: { type: string }
                      available: { type: boolean }
                      message: { type: string }
                      accessToken: { type: string }
                      refreshToken: { type: string }
                      expiresIn: { type: integer, format: int64 }
                    additionalProperties: false
              additionalProperties: false

    AuthMeResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              required: [id, realName, role, principal, homePath]
              properties:
                id: { type: integer, format: int64 }
                username: { type: string }
                realName: { type: string }
                nickname: { type: string }
                avatar: { type: string }
                role: { type: string }
                roles: { type: array, items: { type: string } }
                principal: { type: string, enum: [user, parent] }
                homePath: { type: string }
              additionalProperties: false

    SuccessResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          format: int32
          description: 业务响应码。成功固定为 0。
          example: 0
        message:
          type: string
          example: success
        data:
          description: 响应数据。
      additionalProperties: false

    HealthResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/HealthData'

    ReadyResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ReadyData'

    HealthData:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
      additionalProperties: false

    ReadyData:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]
      additionalProperties: false

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          format: int32
          description: 业务错误码。
          enum: [10001, 10002, 10003, 10004, 10005, 10006, 10007, 20001, 20003, 50000, 50001]
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ValidationDetail'
      additionalProperties: false

    ValidationDetail:
      type: object
      required: [field, reason]
      properties:
        field:
          type: string
          example: username
        reason:
          type: string
          example: 必填
      additionalProperties: false

    PageData:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { type: object }
        total:
          type: integer
          format: int32
      additionalProperties: false

    TeacherAssignment:
      type: object
      required: [id, teacher_user_id, teacher_name, username, school_class_id, school_id, grade, class_name, status]
      properties:
        id: { type: integer, format: int64 }
        teacher_user_id: { type: integer, format: int64 }
        teacher_name: { type: string }
        username: { type: string }
        school_class_id: { type: integer, format: int64 }
        school_id: { type: integer, format: int64 }
        grade: { type: string }
        class_name: { type: string }
        status: { type: string, enum: [active, disabled] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      additionalProperties: false

