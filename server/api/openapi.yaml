        school_class_id: { type: integer, format: int64, minimum: 1 }
        subject: { type: string, maxLength: 64 }
        content: { type: string, minLength: 1, maxLength: 1000 }
        attachment_urls:
          type: array
          maxItems: 9
          items: { type: string, pattern: '^/uploads/' }
        student_ids:
          type: array
          items: { type: integer, format: int64, minimum: 1 }
