            properties:
              student_id: { type: integer, format: int64, minimum: 1 }
              status: { type: string, enum: [completed, incomplete, not_submitted] }
              correction_note: { type: string, maxLength: 500 }
            additionalProperties: false
      additionalProperties: false

    HomeworkTaskResponse:
      allOf:
