openapi: 3.0.3
info:
  title: 豆芽成长助手 API
  version: 0.1.0
  description: |
    托管班系统 API 契约。当前已接入基础档案中心、身份权限、接送、请假、作业和家长端闭环。
servers:
  - url: http://localhost:8080
    description: Local development

# 业务接口使用 bearerAuth；登录和微信 code2Session 入口不需要 bearerAuth。
security: [{ bearerAuth: [] }]

tags:
  - name: Auth
    description: 管理员/教师账号登录和家长微信登录
  - name: Health
    description: 进程活性与依赖就绪检查
  - name: Observability
    description: 可观测性端点
  - name: MasterData
    description: 学校、学期、班级和学生基础档案
  - name: Staffing
    description: 教师账号与负责学校班级的分配
  - name: Pickup
    description: 豆芽成长助手的接送、作业、餐食、每日总结、通知和家长服务 API
  - name: Homework
    description: 按学校班级布置作业、学生逐项批改和家长查看结果
  - name: Meal
    description: 餐食菜单、实际照片和学生饮食备注
  - name: Summary
    description: 教师每日总结生成、发布和结束当天托管
  - name: Parent
    description: 家长绑定、请假申请和家长侧动态查询
  - name: Platform
    description: 平台拥有者对托管机构、邀请码和平台管理员的生命周期管理

paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      security: []
      summary: 管理员或教师登录
      operationId: loginStaff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 3 }
                password: { type: string, minLength: 6 }
              additionalProperties: false
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/platform/overview:
    get:
      tags: [Platform]
      summary: 平台概览统计
      operationId: getPlatformOverview
      responses:
        '200':
          description: 机构、注册申请和邀请码统计
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          organizationCount: { type: integer }
                          activeOrganizationCount: { type: integer }
                          disabledOrganizationCount: { type: integer }
                          pendingRegistrationCount: { type: integer }
                          availableInviteCount: { type: integer }
                          exhaustedInviteCount: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/platform/organizations:
    get:
      tags: [Platform]
      summary: 查询托管机构
      operationId: listPlatformOrganizations
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [pending, active, disabled] } }
      responses:
        '200': { description: 机构列表, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/platform/organizations/{id}/status:
    post:
      tags: [Platform]
      summary: 启用或停用托管机构
      operationId: setPlatformOrganizationStatus
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [pending, active, disabled] }
              additionalProperties: false
      responses:
        '200': { description: 状态已更新, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/platform/organizations/{id}/authorization:
    put:
      tags: [Platform]
      summary: 设置机构服务期限
      operationId: setPlatformOrganizationAuthorization
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [authorizedUntil]
              properties:
                authorizedUntil: { type: string, format: date, description: 留空表示清除期限 }
              additionalProperties: false
      responses:
        '200': { description: 服务期限已更新, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/platform/admins:
    get:
      tags: [Platform]
      summary: 查询平台管理员
      operationId: listPlatformAdmins
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, disabled] } }
      responses:
        '200': { description: 平台管理员列表, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Platform]
      summary: 新增平台管理员
      operationId: createPlatformAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, realName]
              properties:
                username: { type: string, minLength: 3, maxLength: 64 }
                password: { type: string, minLength: 6 }
                realName: { type: string }
                status: { type: string, enum: [active, disabled], default: active }
              additionalProperties: false
      responses:
        '201': { description: 创建成功, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/platform/admins/{id}:
    put:
      tags: [Platform]
      summary: 修改平台管理员
      operationId: updatePlatformAdmin
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [realName, status]
              properties:
                password: { type: string, minLength: 6 }
                realName: { type: string }
                status: { type: string, enum: [active, disabled] }
              additionalProperties: false
      responses:
        '200': { description: 修改成功, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/platform/admins/{id}/status:
    post:
      tags: [Platform]
      summary: 启用或停用平台管理员
      operationId: setPlatformAdminStatus
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, disabled] }
              additionalProperties: false
      responses:
        '200': { description: 状态已更新, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/auth/parent/wechat:
    post:
      tags: [Auth]
      security: []
      summary: 家长微信登录
      description: 首次登录自动创建家长账号；生产环境由服务端使用 code2Session 换取 OpenID。
      operationId: loginParentWithWeChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 1 }
                nickname: { type: string }
                avatar: { type: string }
              additionalProperties: false
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/auth/phone-code:
    post:
      tags: [Auth]
      security: []
      summary: 发送手机号登录验证码
      description: 本地开发环境返回 debug_code 便于测试；生产环境只通过已配置的短信服务发送，不返回验证码明文。
      operationId: requestPhoneCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, minLength: 7, maxLength: 32 }
              additionalProperties: false
      responses:
        '200':
          description: 验证码发送成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhoneCodeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { description: 请求过于频繁, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '503': { description: 短信服务暂不可用, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /api/v1/auth/phone-login:
    post:
      tags: [Auth]
      security: []
      summary: 手机号验证码登录
      operationId: loginWithPhoneCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string, minLength: 7, maxLength: 32 }
                code: { type: string, minLength: 4, maxLength: 8 }
              additionalProperties: false
      responses:
        '200':
          description: 验证成功，返回可选择的家长或教职工入口
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhoneLoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { description: 验证服务暂不可用, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: 刷新登录 Token
      operationId: refreshAuthToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
              additionalProperties: false
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: 当前登录身份
      operationId: getAuthMe
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 当前身份
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthMeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/codes:
    get:
      tags: [Auth]
      summary: 当前身份权限码
      operationId: getAuthCodes
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 权限码列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties: { data: { type: array, items: { type: string } } }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: 退出登录
      operationId: logoutAuth
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 退出成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties: { data: { type: boolean } }

  /health:
    get:
      tags: [Health]
      security: []
      summary: 活性检查
      description: 只检查 API 进程是否存活，不访问 MySQL、Redis 或外部依赖。
      operationId: getHealth
      parameters:
        - $ref: '#/components/parameters/RequestIDHeader'
      responses:
        '200':
          description: API 进程存活
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                ok:
                  value:
                    code: 0
                    message: success
                    data:
                      status: ok
        '500':
          $ref: '#/components/responses/InternalError'

  /ready:
    get:
      tags: [Health]
      security: []
      summary: 就绪检查
      description: 检查已启用的依赖是否可用，例如 MySQL、Redis。依赖未启用时只返回 ready。
      operationId: getReady
      parameters:
        - $ref: '#/components/parameters/RequestIDHeader'
      responses:
        '200':
          description: API 可接收业务流量
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              examples:
                ready:
                  value:
                    code: 0
                    message: success
                    data:
                      status: ready
        '503':
          description: 依赖不可用
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                dependencyUnavailable:
                  value:
                    code: 50001
                    message: 服务暂不可用
        '500':
          $ref: '#/components/responses/InternalError'

  /metrics:
    get:
      tags: [Observability]
      security: []
      summary: Prometheus 指标
      description: 当 `observability.metrics.enabled=true` 时启用。该端点不使用统一 JSON envelope。
      operationId: getMetrics
      responses:
        '200':
          description: Prometheus/OpenMetrics 文本指标
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP tuoguan_system_http_requests_total Total number of HTTP requests handled by the API.
                # TYPE tuoguan_system_http_requests_total counter
                tuoguan_system_http_requests_total{method="GET",route="/health",status="200"} 1
        '404':
          $ref: '#/components/responses/NotFound'

  /uploads/{path}:
    get:
      tags: [Pickup]
      security: []
      summary: 读取签名照片
      description: 接送照片和作业图片只能通过查询参数 expires、sig 短时签名访问，原始上传路径不公开。
      operationId: getSignedUpload
      parameters:
        - in: path
          name: path
          required: true
          schema: { type: string }
        - in: query
          name: expires
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: sig
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 图片内容
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
        '403':
          description: 签名缺失、无效或已过期
        '404':
          description: 图片不存在

  /api/v1/summary:
    get:
      tags: [MasterData]
      summary: 基础档案统计
      operationId: getMasterDataSummary
      responses:
        '200':
          description: 档案数量统计
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterSummaryResponse'

  /api/v1/schools:
    get:
      tags: [MasterData]
      summary: 查询学校
      operationId: listSchools
      responses:
        '200':
          description: 学校列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolListResponse'
    post:
      tags: [MasterData]
      summary: 新增学校
      operationId: createSchool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchoolCreateRequest'
      responses:
        '201':
          description: 学校创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/academic-terms:
    get:
      tags: [MasterData]
      summary: 查询学年学期
      operationId: listAcademicTerms
      responses:
        '200':
          description: 学期列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicTermListResponse'
    post:
      tags: [MasterData]
      summary: 新增学年学期
      operationId: createAcademicTerm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicTermCreateRequest'
      responses:
        '201':
          description: 学期创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicTermResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/school-classes:
    get:
      tags: [MasterData]
      summary: 查询学校班级
      operationId: listSchoolClasses
      responses:
        '200':
          description: 学校班级列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolClassListResponse'
    post:
      tags: [MasterData]
      summary: 新增学校班级
      operationId: createSchoolClass
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchoolClassCreateRequest'
      responses:
        '201':
          description: 学校班级创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolClassResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/teacher-assignments:
    get:
      tags: [Staffing]
      summary: 查询教师负责班级
      description: 教师身份只能查询自己的分配；管理员和编辑者可以查询全部分配。
      operationId: listTeacherClassAssignments
      parameters:
        - in: query
          name: teacher_user_id
          schema: { type: integer, format: int64, minimum: 1 }
        - in: query
          name: school_class_id
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: 教师班级分配列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherAssignmentListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Staffing]
      summary: 新增教师负责班级
      description: 只有管理员或编辑者可以配置；停用过的相同分配再次提交会自动启用。
      operationId: createTeacherClassAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherAssignmentCreateRequest'
      responses:
        '201':
          description: 分配创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherAssignmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/teacher-assignments/{id}:
    put:
      tags: [Staffing]
      summary: 启用或停用教师班级分配
      operationId: updateTeacherClassAssignment
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherAssignmentStatusRequest'
      responses:
        '200':
          description: 分配状态更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherAssignmentResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/care-classes:
    get:
      tags: [MasterData]
      summary: 查询托管班
      operationId: listCareClasses
      responses:
        '200':
          description: 托管班列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareClassListResponse'
    post:
      tags: [MasterData]
      summary: 新增托管班
      operationId: createCareClass
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CareClassCreateRequest'
      responses:
        '201':
          description: 托管班创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareClassResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/students:
    get:
      tags: [MasterData]
      summary: 查询学生档案
      operationId: listStudents
      parameters:
        - in: query
          name: school_id
          schema: { type: integer, format: int64 }
        - in: query
          name: term_id
          schema: { type: integer, format: int64 }
        - in: query
          name: school_class_id
          schema: { type: integer, format: int64 }
        - in: query
          name: care_class_id
          schema: { type: integer, format: int64 }
        - in: query
          name: grade
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [active, inactive] }
        - in: query
          name: keyword
          schema: { type: string }
      responses:
        '200':
          description: 学生列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentListResponse'
    post:
      tags: [MasterData]
      summary: 新增学生档案
      operationId: createStudent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentCreateRequest'
      responses:
        '201':
          description: 学生档案创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/students/profile:
    post:
      tags: [MasterData]
      summary: 通过学生档案新增并自动归类
      description: 直接填写学校、年级、班级和可选托管班名称；服务端自动复用或创建分类，并默认使用当前学期。
      operationId: createStudentProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentProfileRequest'
      responses:
        '201':
          description: 学生档案创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/students/import:
    post:
      tags: [MasterData]
      summary: 批量导入学生档案
      description: 接收已由管理端解析的学生档案列表；服务端自动归类学校、年级、班级和托管班，重复学生跳过并返回原始行号。有效记录一次性写入，MySQL 使用事务。
      operationId: importStudents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              additionalProperties: false
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    $ref: '#/components/schemas/StudentProfileRequest'
      responses:
        '200':
          description: 导入完成，可能同时返回重复和无效行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentImportResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/students/{id}:
    put:
      tags: [MasterData]
      summary: 更新学生档案
      operationId: updateStudent
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentUpdateRequest'
      responses:
        '200':
          description: 学生档案更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/students/{id}/profile:
    put:
      tags: [MasterData]
      summary: 通过学生档案编辑并自动归类
      description: 编辑时仍使用学校、年级、班级和可选托管班名称；服务端先解析结构化关系再更新学生。
      operationId: updateStudentProfile
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentProfileRequest'
      responses:
        '200':
          description: 学生档案更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/homework-tasks:
    get:
      tags: [Homework]
      summary: 查询作业任务
      description: 教师身份只返回自己负责班级的作业；管理员和编辑者可以查看全部。
      operationId: listHomeworkTasks
      parameters:
        - in: query
          name: date
          schema: { type: string, format: date }
        - in: query
          name: school_class_id
          schema: { type: integer, format: int64, minimum: 1 }
        - in: query
          name: status
          schema: { type: string, enum: [active, cancelled] }
      responses:
        '200':
          description: 作业任务列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeworkTaskListResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Homework]
      summary: 布置作业
      description: student_ids 为空时为该学校班级全部在托学生；传入 student_ids 时只为选中的学生布置，可用于个别学生作业。
      operationId: createHomeworkTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HomeworkTaskCreateRequest'
      responses:
        '201':
          description: 作业布置成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeworkTaskResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/homework-tasks/{id}/students:
    get:
      tags: [Homework]
      summary: 查询作业学生名单
      operationId: listHomeworkTaskStudents
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: 学生作业完成情况
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeworkTaskStudentListResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/homework-tasks/{id}/students/{student_id}/review:
    post:
      tags: [Homework]
      summary: 批改学生作业
      operationId: reviewHomeworkStudent
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - in: path
          name: student_id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HomeworkReviewRequest'
      responses:
        '200':
          description: 批改结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeworkTaskStudentResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/homework-tasks/{id}/students/bulk-review:
    post:
      tags: [Homework]
      summary: 批量批改学生作业
      description: 先校验整批学生都属于该作业，再一次性保存反馈；任一学生不存在时整批失败。
      operationId: bulkReviewHomeworkStudents
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HomeworkBulkReviewRequest'
      responses:
        '200':
          description: 批量批改结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeworkTaskStudentListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/parent/students/{student_id}/homework:
    get:
      tags: [Parent, Homework]
      summary: 家长查看孩子作业
      operationId: listParentHomework
      parameters:
        - in: path
          name: student_id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - in: query
          name: date
          schema: { type: string, format: date }
      responses:
        '200':
          description: 孩子作业和批改结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentHomeworkListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/pickup-schedules:
    get:
      tags: [Pickup]
      summary: 查询周期接送排班
      description: 教师只能看到自己负责班级的排班；管理角色可以查看全机构排班。
      operationId: listPickupSchedules
      parameters:
        - in: query
          name: date
          description: 传入日期时只返回该日期生效的规则。
          schema: { type: string, format: date }
      responses:
        '200':
          description: 周期排班列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickupScheduleListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Pickup]
      summary: 创建周期接送排班
      description: 创建周一至周日的重复规则。规则只会自动生成待教师确认的当天任务，不会直接跳过确认通知家长。
      operationId: createPickupSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PickupScheduleRequest' }
      responses:
        '201':
          description: 排班创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupScheduleResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/pickup-schedules/generate:
    post:
      tags: [Pickup]
      summary: 按周期排班生成当天接送任务
      description: 生成当天符合规则的 draft 任务；已有任务、无在托学生或停用班级会跳过。
      operationId: generatePickupScheduleOperations
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: { date: { type: string, format: date } }
              additionalProperties: false
      responses:
        '200':
          description: 生成结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupScheduleGenerationResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/pickup-schedules/{id}:
    put:
      tags: [Pickup]
      summary: 更新周期接送排班
      operationId: updatePickupSchedule
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PickupScheduleRequest' }
      responses:
        '200':
          description: 排班更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupScheduleResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/pickup-workbench:
    get:
      tags: [Pickup]
      summary: 查询教师今日工作台
      description: 聚合当天接送任务、逐人状态和待处理提醒；教师只会看到自己负责班级。
      operationId: getPickupWorkbench
      parameters:
        - in: query
          name: date
          schema: { type: string, format: date }
      responses:
        '200':
          description: 教师工作台
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/PickupWorkbench' } }

  /api/v1/pickup-operations:
    get:
      tags: [Pickup]
      summary: 查询每日接送任务
      operationId: listPickupOperations
      parameters:
        - in: query
          name: date
          description: 按接送日期筛选。
          schema: { type: string, format: date }
        - in: query
          name: status
          description: 按任务状态筛选。
          schema: { $ref: '#/components/schemas/PickupOperationStatus' }
      responses:
        '200':
          description: 接送任务列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickupOperationListResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Pickup]
      summary: 创建每日接送任务
      description: 根据学校班级和可选的托管班筛选在托学生，生成当天接送名单。管理端可辅助创建；教师只能为自己已授权的学校班级创建，且不需要等待管理端。每个学校班级每天最多创建一条有效任务。
      operationId: createPickupOperation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PickupOperationCreateRequest'
      responses:
        '201':
          description: 接送任务创建成功，初始状态为 draft
          headers:
            Location:
              description: 新建接送任务资源地址
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickupOperationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/pickup-operations/{id}/students:
    get:
      tags: [Pickup]
      summary: 查询接送任务名单
      operationId: listPickupOperationStudents
      parameters:
        - $ref: '#/components/parameters/PickupOperationID'
      responses:
        '200':
          description: 接送学生名单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickupOperationStudentListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [Pickup]
      summary: 添加当天临时学生
      description: 教师可先添加姓名和接送信息，系统保留待补档案标记，详细资料随后补充。
      operationId: addPickupOperationStudent
      parameters:
        - $ref: '#/components/parameters/PickupOperationID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PickupOperationTemporaryStudentRequest'
      responses:
        '201':
          description: 临时学生已加入名单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickupOperationStudentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/pickup-operations/{id}/events:
    get:
      tags: [Pickup]
      summary: 查询接送事件历史
      description: 每次学生状态登记都会追加一条事件，不覆盖历史记录。
      operationId: listPickupEvents
      parameters:
        - $ref: '#/components/parameters/PickupOperationID'
      responses:
        '200':
          description: 接送事件列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickupEventListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/pickup-operations/{id}/events/{event_id}/correct:
    post:
      tags: [Pickup]
      summary: 带原因更正接送事件
      description: 不覆盖原事件，追加 correction 事件并通知相关家长；教师只能更正自己负责班级的事件。
      operationId: correctPickupEvent
      parameters:
        - $ref: '#/components/parameters/PickupOperationID'
        - in: path
          name: event_id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, reason]
              properties:
                status: { $ref: '#/components/schemas/PickupStudentStatus' }
                reason: { type: string, minLength: 1, maxLength: 500 }
              additionalProperties: false
      responses:
        '200':
          description: 接送记录已更正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickupOperationStudentResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/pickup-operations/{id}/students/{student_id}/profile:
    post:
      tags: [Pickup]
      summary: 补充临时学生档案
      description: 教师可在当天接送后补充临时学生的家长和紧急联系人资料；资料更新后清除档案待补标记。
      operationId: completePickupOperationStudentProfile
      parameters:
        - $ref: '#/components/parameters/PickupOperationID'
        - in: path
          name: student_id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PickupOperationStudentProfileRequest'
      responses:
        '200':
          description: 临时学生档案已补充
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickupOperationStudentProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/pickup-operations/{id}/confirm:
    post:
      tags: [Pickup]
      summary: 确认今日接送任务
      description: 确认执行老师后，将今日接送安排通知已绑定的家长。
      operationId: confirmPickupOperation
      parameters:
        - $ref: '#/components/parameters/PickupOperationID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PickupOperationConfirmRequest'
      responses:
        '200':
          description: 接送任务已确认
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickupOperationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/pickup-operations/{id}/handover:
    post:
      tags: [Pickup]
      summary: 途中交接接送任务
      description: 接送开始后，当前执行老师可将任务交接给同一学校班级下另一名已授权教师；交接会保留历史并通知已绑定家长。
      operationId: handoverPickupOperation
      parameters:
        - $ref: '#/components/parameters/PickupOperationID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PickupOperationHandoverRequest'
      responses:
        '200':
          description: 接送任务已完成交接
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickupOperationResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/pickup-operations/{id}/handoff-teachers:
    get:
      tags: [Pickup]
      summary: 查询可交接教师
      description: 只返回当前接送任务学校班级下启用中的教师，教师只能查询自己负责的班级。
      operationId: listPickupHandoffTeachers
      parameters:
        - $ref: '#/components/parameters/PickupOperationID'
      responses:
        '200':
          description: 可接手教师列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickupHandoffTeacherListResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/pickup-operations/{id}/handoffs:
    get:
      tags: [Pickup]
      summary: 查询接送交接历史
      operationId: listPickupHandoffs
      parameters:
        - $ref: '#/components/parameters/PickupOperationID'
      responses:
        '200':
          description: 接送交接历史
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickupHandoffListResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/pickup-operations/{id}/close-check:
    get:
      tags: [Pickup]
      summary: 收班检查
      description: 返回未完成学生、异常和待补照片，只有完成必要状态确认后才能收班。
      operationId: getPickupCloseCheck
      parameters:
        - $ref: '#/components/parameters/PickupOperationID'
      responses:
        '200':
          description: 收班检查结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/PickupCloseCheck' } }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/pickup-operations/{id}/start:
    post:
      tags: [Pickup]
      summary: 开始接送任务
      description: 任务从 draft 进入 started，之后才能登记学生状态。
      operationId: startPickupOperation
      parameters:
        - $ref: '#/components/parameters/PickupOperationID'
      responses:
        '200':
          description: 接送任务已开始
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickupOperationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/pickup-operations/{id}/finish:
    post:
      tags: [Pickup]
      summary: 完成接送任务
      description: 只有名单中每个学生都已登记为接到、自行到达、家长接走、请假或未到时，任务才能从 started 进入 finished。
      operationId: finishPickupOperation
      parameters:
        - $ref: '#/components/parameters/PickupOperationID'
      responses:
        '200':
          description: 接送任务已完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickupOperationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/pickup-operations/{id}/students/{student_id}/status:
    post:
      tags: [Pickup]
      summary: 登记学生接送状态
      description: 校门口接到 picked_up 必须提供 photo_url；每次登记都会更新当前状态、追加事件并创建一条待推送家长通知。
      operationId: markPickupOperationStudent
      parameters:
        - $ref: '#/components/parameters/PickupOperationID'
        - in: path
          name: student_id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PickupStudentStatusRequest'
      responses:
        '200':
          description: 学生状态登记成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickupOperationStudentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/pickup-operations/{id}/students/bulk-arrive:
    post:
      tags: [Pickup]
      summary: 批量确认学生到班
      description: 仅用于确认已经完成校门口接到或自行到班记录的学生到达托管班。校门口接到仍必须逐人拍照，不允许通过批量接口跳过照片要求。
      operationId: bulkArrivePickupOperationStudents
      parameters:
        - $ref: '#/components/parameters/PickupOperationID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkArrivePickupStudentsRequest'
      responses:
        '200':
          description: 批量到班确认成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickupOperationStudentListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/pickup-change-requests:
    get:
      tags: [Pickup]
      summary: 查询临时接送变更
      operationId: listPickupChangeRequests
      parameters:
        - in: query
          name: date
          schema: { type: string, format: date }
        - in: query
          name: status
          schema: { type: string, enum: [pending, approved, rejected] }
      responses:
        '200':
          description: 临时接送变更列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items: { type: array, items: { $ref: '#/components/schemas/PickupChangeRequest' } }
                          total: { type: integer, format: int32 }

  /api/v1/pickup-change-requests/{id}/review:
    post:
      tags: [Pickup]
      summary: 审核临时接送变更
      operationId: reviewPickupChangeRequest
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PickupChangeRequestReviewRequest'
      responses:
        '200':
          description: 变更已审核
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/PickupChangeRequest' } }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/notifications:
    get:
      tags: [Pickup]
      summary: 查询待推送通知记录
      description: 当前返回接送和作业产生的通知记录；配置微信订阅消息后会异步尝试推送，并回写 sent 或 failed。
      operationId: listNotifications
      responses:
        '200':
          description: 通知记录列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'

  /api/v1/notifications/batch:
    post:
      tags: [Notification]
      summary: 批量通知家长
      description: 教师只能通知自己负责班级的在托学生；每名学生生成一条站内通知并写入异步 outbox，消息发送失败不影响业务流程。
      operationId: createBatchNotifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [student_ids, title, content]
              additionalProperties: false
              properties:
                student_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: { type: integer, format: int64, minimum: 1 }
                kind:
                  type: string
                  enum: [teacher_notice, pickup_reminder, homework_reminder, meal_reminder]
                  default: teacher_notice
                title: { type: string, minLength: 1, maxLength: 80 }
                content: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200':
          description: 通知已写入站内通知和异步发送队列
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchNotificationResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/notifications/delivery-logs:
    get:
      tags: [Notification]
      summary: 查询通知投递日志
      description: 管理员和编辑可按通知或状态查看逐家长投递结果。
      operationId: listNotificationDeliveryLogs
      parameters:
        - in: query
          name: notification_id
          schema: { type: integer, format: int64, minimum: 1 }
        - in: query
          name: status
          schema: { type: string, enum: [pending, sent, failed, skipped] }
        - in: query
          name: message_kind
          schema: { type: string, enum: [pickup, meal, homework, leave, summary] }
      responses:
        '200':
          description: 通知投递日志
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationDeliveryLogListResponse'
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/notifications/{id}/retry:
    post:
      tags: [Notification]
      summary: 重试失败通知
      operationId: retryNotification
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200': { description: 通知已加入重试队列 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/audit-logs:
    get:
      tags: [Audit]
      summary: 查询关键操作审计日志
      description: 仅管理员和编辑可查看机构审计记录。
      operationId: listAuditLogs
      parameters:
        - in: query
          name: action
          schema: { type: string }
        - in: query
          name: resource_type
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: 审计日志
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListResponse'
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/notifications/{id}/read:
    post:
      tags: [Pickup]
      summary: 标记通知已读
      operationId: markNotificationRead
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: 通知已读

  /api/v1/uploads/pickup:
    post:
      tags: [Pickup]
      summary: 上传接送照片
      description: 支持 JPEG、PNG、WebP，单张照片最大 5 MiB。返回的 url 仅用于内部关联；查询动态时服务端返回短时签名 URL。
      operationId: uploadPickupPhoto
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 接送现场照片。
                operation_id:
                  type: integer
                  format: int64
                  minimum: 1
                  description: 可选的接送任务 ID，用于媒体元数据关联。
      responses:
        '201':
          description: 照片上传成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadAssetResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          description: 照片超过 5 MiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: 文件类型不支持
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/uploads/homework:
    post:
      tags: [Homework]
      summary: 上传作业图片
      description: 支持 JPEG、PNG、WebP，单张图片最大 5 MiB。返回的 url 用于内部关联，家长查询作业时会收到短时签名 URL。
      operationId: uploadHomeworkPhoto
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 作业图片。
                task_id:
                  type: integer
                  format: int64
                  minimum: 1
                  description: 可选的作业任务 ID，用于媒体元数据关联。
      responses:
        '201':
          description: 作业图片上传成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadAssetResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          description: 图片超过 5 MiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: 文件类型不支持
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/parent/bindings:
    post:
      tags: [Parent]
      summary: 绑定孩子（兼容接口）
      description: 兼容旧版本客户端使用的接口。新家长端不再要求填写学生档案编号，统一通过 POST /api/v1/parent/child-applications 提交入班申请，由教师审核后自动建档并绑定。
      operationId: bindParentStudent
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParentBindingCreateRequest'
      responses:
        '201':
          description: 孩子绑定成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentBindingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/parent/child-applications:
    post:
      tags: [Parent]
      summary: 提交孩子入班申请
      description: 家长可以通过教师分享的小程序码提交孩子姓名；服务端验证 invite_token 后自动带入学校班级，申请必须经过教师或管理员审核。
      operationId: createParentChildApplication
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChildApplicationCreateRequest'
      responses:
        '201':
          description: 入班申请已提交
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildApplicationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    get:
      tags: [Parent]
      summary: 查询当前家长的入班申请
      operationId: listParentChildApplications
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 当前家长提交的入班申请列表
          content:
            application/json:
              schema:
              $ref: '#/components/schemas/ChildApplicationListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/parent/class-invites/{token}:
    get:
      tags: [Parent]
      summary: 查询班级邀请信息
      description: 家长扫码进入小程序后，用签名邀请标识查询班级展示信息；不会返回学生数据。
      operationId: getParentClassInvite
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string, minLength: 4, maxLength: 64 }
      responses:
        '200':
          description: 班级邀请信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassInviteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/class-invites/qrcode:
    get:
      tags: [Parent]
      summary: 生成班级邀请小程序码
      description: 教师只能为自己负责的班级生成官方微信小程序码，管理员可以生成全机构班级的小程序码。
      operationId: getClassInviteQRCode
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: school_class_id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: PNG 格式微信小程序码
          content:
            image/png: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/v1/parent/child-applications/{id}:
    put:
      tags: [Parent]
      summary: 补充资料并重新提交入班申请
      description: 仅允许当前家长修改 needs_info 状态的申请；提交后状态回到 pending，重新进入老师审核队列。
      operationId: updateParentChildApplication
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChildApplicationCreateRequest'
      responses:
        '200':
          description: 入班申请已重新提交
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildApplicationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/child-applications:
    get:
      tags: [Parent]
      summary: 查询待审核的家长入班申请
      description: 教师只会看到自己负责的学校班级申请；管理员可以看到全部申请。
      operationId: listStaffChildApplications
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 入班申请列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildApplicationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/child-applications/{id}/review:
    post:
      tags: [Parent]
      summary: 审核孩子入班申请
      description: 教师只能审核自己负责班级的申请；审核通过会自动匹配或创建学生档案、建立家长绑定并发送通知。
      operationId: reviewChildApplication
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChildApplicationReviewRequest'
      responses:
        '200':
          description: 入班申请审核完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildApplicationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/parent/me:
    get:
      tags: [Parent]
      summary: 查询当前家长和孩子
      description: 只返回当前家长已绑定且仍有效的孩子。
      operationId: getParentMe
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 家长资料和孩子列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentMeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/parent/students:
    get:
      tags: [Parent]
      summary: 查询当前家长的孩子
      operationId: listParentStudents
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 已绑定孩子列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentBindingListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/parent/students/{student_id}/pickup-events:
    get:
      tags: [Parent]
      summary: 查询孩子接送动态
      description: 只有已绑定该学生的家长可以查询；可按日期筛选，事件中的照片 URL 可用于查看接送现场照片。
      operationId: listParentStudentPickupEvents
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: student_id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - in: query
          name: date
          description: 按接送日期筛选。
          schema: { type: string, format: date }
      responses:
        '200':
          description: 孩子接送事件列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentPickupEventListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/parent/notifications:
    get:
      tags: [Parent]
      summary: 查询当前家长通知
      description: 只返回当前家长已绑定孩子产生的通知。
      operationId: listParentNotifications
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 家长通知列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentNotificationListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/parent/notifications/{id}/read:
    post:
      tags: [Parent]
      summary: 家长标记通知已读
      operationId: markParentNotificationRead
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: 通知已读
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/parent/students/{student_id}/pickup-today:
    get:
      tags: [Parent]
      summary: 查询孩子今日接送安排
      operationId: getParentPickupToday
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: student_id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - in: query
          name: date
          schema: { type: string, format: date }
      responses:
        '200':
          description: 今日接送安排；没有安排时 data 为 null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        allOf:
                          - $ref: '#/components/schemas/ParentPickupToday'
                        nullable: true
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/parent/leave-requests:
    get:
      tags: [Parent]
      summary: 查询当前家长请假记录
      operationId: listParentLeaveRequests
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 家长请假记录列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequestListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/parent/leave-requests/{id}:
    put:
      tags: [Parent]
      summary: 修改待审核请假申请
      operationId: updateParentLeaveRequest
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveRequestCreateRequest' }
      responses:
        '200': { description: 请假申请已修改, content: { application/json: { schema: { $ref: '#/components/schemas/LeaveRequestResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/parent/leave-requests/{id}/cancel:
    post:
      tags: [Parent]
      summary: 撤回待审核请假申请
      operationId: cancelParentLeaveRequest
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200': { description: 请假申请已撤回, content: { application/json: { schema: { $ref: '#/components/schemas/LeaveRequestResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/parent/students/{student_id}/leave-requests:
    post:
      tags: [Parent]
      summary: 提交孩子请假申请
      description: 申请初始状态为 pending，老师审核后变为 approved 或 rejected；只有已绑定该学生的家长可以提交。
      operationId: createParentLeaveRequest
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: student_id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveRequestCreateRequest'
      responses:
        '201':
          description: 请假申请已提交
          content:
